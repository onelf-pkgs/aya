# Aya for onelf: the Android ADB desktop app packed as one file,
# carrying upstream's whole AppImage payload and the desktop stack
# upstream leaves to the host.
#
# The control repository, onelf-pkgs/.github, bumps the sources here when
# upstream releases and resets `release` to 1. Raise `release` by hand
# when the recipe changes and the sources do not.
name = "aya"
release = 1
arches = ["x86_64"]
self-update = true

[sources.aya]
version = "1.14.2"
url = "https://github.com/liriliri/aya/releases/download/v{version}/AYA-{version}-linux-x86_64.AppImage"
sha256 = "27ac157324191973c121250c1f2bbaeee8fbff626cffd309605a1b7c1c2f6967"
upstream = { github = "liriliri/aya", tag = "^v([0-9.]+)$" }
